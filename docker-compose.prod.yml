# =============================================================================
# docker-compose.prod.yml — Production overrides
# =============================================================================
# Usage : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Optimisations pour la production :
#   - Workers réduits (moins de CPU/RAM)
#   - Healthchecks moins fréquents
#   - Logs moins verbeux
#   - Images pré-buildées (pas de rebuild)
# =============================================================================

services:
  api:
    environment:
      LOG_LEVEL: WARNING
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M
    healthcheck:
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  kernel:
    environment:
      LOG_LEVEL: WARNING
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 512M
    healthcheck:
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  modules:
    environment:
      LOG_LEVEL: WARNING
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  ui:
    environment:
      NODE_ENV: production
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  nats:
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

  redis:
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  postgres:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M
    healthcheck:
      interval: 30s
      timeout: 5s
      start_period: 10s

