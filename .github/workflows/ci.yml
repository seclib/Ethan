# =============================================================================
# ETHAN — CI Pipeline
# =============================================================================
# Jobs :
#   lint         → Ruff + import-linter (toujours)
#   test-unit    → pytest (unit, pas de docker requis)
#   build-base   → docker build ethan/python-base (cache partagé)
#   build-images → docker build api/kernel/module (dépendent de build-base)
#   test-integration → docker compose up + pytest tests/integration/
#   security     → TruffleHog + Trivy CVE scan
#   release      → push sur GHCR (uniquement sur tag vX.Y.Z)
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/ethan
  PYTHON_VERSION: "3.12"

# Annuler les runs en cours si un nouveau push arrive sur la même branche
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. LINT & STATIC ANALYSIS
  # ============================================================================
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: pip install ruff import-linter

      - name: Ruff — style & format check
        run: ruff check core/ interfaces/ plugins/ sdk/

      - name: Ruff — format (no changes)
        run: ruff format --check core/ interfaces/ plugins/ sdk/

      - name: Import-linter — architecture contracts
        run: |
          pip install -e ".[dev]" --quiet
          lint-imports
        continue-on-error: true  # warn uniquement, pas bloquant

  # ============================================================================
  # 2. UNIT TESTS (pas de Docker requis)
  # ============================================================================
  test-unit:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[server,dev]" --quiet

      - name: Run unit tests
        run: |
          pytest tests/test_imports.py \
                 tests/test_audit.py \
                 tests/test_facts.py \
                 tests/test_loading.py \
                 -v --tb=short \
                 --cov=core --cov-report=xml \
                 -m "not docker and not live and not slow"

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ============================================================================
  # 3. BUILD DOCKER — Image de base partagée
  # ============================================================================
  build-base:
    name: Build Python Base Image
    runs-on: ubuntu-latest
    needs: lint
    outputs:
      base-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:latest

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push python-base
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.python-base
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/python-base:latest
            ${{ env.IMAGE_PREFIX }}/python-base:${{ github.sha }}
          cache-from: type=gha,scope=python-base
          cache-to: type=gha,scope=python-base,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # ============================================================================
  # 4. BUILD DOCKER — Images applicatives (dépendent de la base)
  # ============================================================================
  build-images:
    name: Build ${{ matrix.service }} Image
    runs-on: ubuntu-latest
    needs: build-base
    strategy:
      matrix:
        service: [api, kernel, module]
        include:
          - service: api
            dockerfile: deploy/Dockerfile.api
            image_suffix: api
          - service: kernel
            dockerfile: deploy/Dockerfile.kernel
            image_suffix: kernel
          - service: module
            dockerfile: deploy/Dockerfile.module
            image_suffix: modules
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image_suffix }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image_suffix }}:${{ github.sha }}
          cache-from: |
            type=gha,scope=${{ matrix.service }}
            type=gha,scope=python-base
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  # ============================================================================
  # 5. INTEGRATION TESTS (Docker Compose)
  # ============================================================================
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-base
    env:
      POSTGRES_PASSWORD: ci-test-password
      VAULT_DEV_ROOT_TOKEN_ID: ci-test-token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install test dependencies
        run: pip install -e ".[server,dev]" --quiet

      - name: Start infrastructure services
        run: |
          docker compose \
            -f docker-compose.yml \
            up -d nats redis postgres prometheus
          # Attendre que les services soient healthy
          timeout 90 bash -c 'until docker compose ps | grep -E "(nats|redis|postgres)" | grep -v "unhealthy" | grep "healthy"; do sleep 3; done'

      - name: Run integration tests
        run: |
          pytest tests/integration/test_integration.py \
                 tests/test_boot.py \
                 -v --tb=short \
                 -m "not live and not slow" \
                 --timeout=60
        env:
          NATS_URL: nats://localhost:4222
          REDIS_URL: redis://localhost:6379/0
          DATABASE_URL: postgresql://ethan:ci-test-password@localhost:5432/ethan

      - name: Collect docker logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Stop services
        if: always()
        run: docker compose down -v

  # ============================================================================
  # 6. SECURITY SCAN
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # TruffleHog a besoin de l'historique complet

      - name: TruffleHog — secrets scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: .
          base: ${{ github.event.repository.default_branch }}
          head: ${{ github.ref }}
          extra_args: --results=verified,unknown

      - name: Trivy — filesystem CVE scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"  # warn uniquement

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ============================================================================
  # 7. RELEASE — Push images versionnées (uniquement sur tag vX.Y.Z)
  # ============================================================================
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    needs: [test-unit, build-images, test-integration, security]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Re-tag images with version
        run: |
          for svc in python-base api kernel modules; do
            docker buildx imagetools create \
              --tag ${{ env.IMAGE_PREFIX }}/${svc}:${{ steps.version.outputs.version }} \
              ${{ env.IMAGE_PREFIX }}/${svc}:${{ github.sha }} || true
          done

      - name: Generate release notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            docker-compose.yml
            docker-compose.prod.yml
            docker-compose.observability.yml