[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "Ethan"
dynamic = ["version"]
description = "Ethan — modular AI assistant backend with composable intelligence primitives"
readme = "README.md"
# Upper bound: numpy 2.2.x (pinned transitively via datasets/pandas) ships no
# cp314 Windows wheel, so under Python 3.14 uv would compile numpy from source
# (Meson) and fail on Windows boxes without a C toolchain (#350). Cap to the
# range that has prebuilt wheels; matches the classifiers (3.10–3.13).
requires-python = ">=3.10,<3.14"
license = {text = "Apache-2.0"}
authors = [
    {name = "Ethan Contributors"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "asyncpg>=0.29",
    "click>=8",
    "datasets>=4.5.0",
    "ddgs>=9.11.4",
    "httpx>=0.27",
    "nats-py>=2.0",
    "openai>=1.30",
    "nvidia-ml-py>=12.560.30",
    "posthog>=3.0",
    "python-telegram-bot>=22.6",
    "redis>=5.0",
    "rich>=13",
    "tomli>=2.0; python_version < '3.11'",
    "tomlkit>=0.12",
    "websockets>=15.0.1",
]

[project.optional-dependencies]
dev = [
    "maturin>=1.12.6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "respx>=0.22",
    "ruff>=0.4",
    "pre-commit>=3.0",
]
inference-cloud = [
    "openai>=1.30",
    "anthropic>=0.30",
]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "slowapi>=0.1.9",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
]

[project.urls]
Homepage = "https://github.com/ethan/Ethan"
Documentation = "https://ethan.github.io/Ethan/"
Repository = "https://github.com/ethan/Ethan"
Issues = "https://github.com/ethan/Ethan/issues"

[project.scripts]
ethan = "core.main:main"

# Version is derived from git tags by hatch-vcs (see #526). For source/editable
# checkouts this yields the true `git describe` version (e.g. 1.0.3.dev109+g<sha>)
# rather than a stale static string. CI release builds override this with
# SETUPTOOLS_SCM_PRETEND_VERSION so the published version equals the pushed tag.
#
# setuptools_scm cannot bump custom `.devN` tags (only `.dev0`), so the autotag
# `vX.Y.Z.devN` tags are deliberately EXCLUDED from version derivation here; the
# base is taken from the latest plain release tag (vX.Y.Z) and the dev distance
# is computed from commit count since that release.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
tag_regex = '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
git_describe_command = [
    "git", "describe", "--dirty", "--tags", "--long",
    "--match", "v[0-9]*", "--exclude", "*dev*", "--exclude", "*rc*", "--exclude", "desktop-*",
]
# Builds without a git checkout (e.g. the `COPY src/ src/` Docker stages, which
# never include .git) can't run `git describe`. Without a fallback that would
# hard-fail the build. Mirror the runtime sentinel in src/openjarvis/__init__.py.
# Such builds can inject the real version via SETUPTOOLS_SCM_PRETEND_VERSION.
fallback_version = "0.0.0+unknown"

[tool.hatch.build.targets.wheel]
packages = ["core", "sdk", "plugins", "interfaces"]

[tool.hatch.build.targets.wheel.force-include]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "core"

[[tool.importlinter.contracts]]
name = "RÈGLE 1 — Core kernel indépendant"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = [
    "legacy",
    "interfaces",
    "plugins",
    "examples",
    "tests",
]

[[tool.importlinter.contracts]]
name = "RÈGLE 2 — Core agents n'importe que core.* sans core.agents entre eux"
type = "forbidden"
source_modules = ["core.agents"]
forbidden_modules = [
    "legacy",
    "interfaces",
    "plugins",
    "examples",
]

[[tool.importlinter.contracts]]
name = "RÈGLE 3 — Core bus ne dépend pas des implémentations LLM/skills"
type = "forbidden"
source_modules = ["core.bus"]
forbidden_modules = [
    "core.llm",
    "core.skills",
    "core.facts",
    "core.cost",
    "core.agents",
    "core.planner",
    "core.executive",
    "core.orchestrator",
]

[[tool.importlinter.contracts]]
name = "RÈGLE 4 — Legacy n'importe pas les nouveaux modules core"
type = "forbidden"
source_modules = ["legacy"]
forbidden_modules = [
    "core.facts",
    "core.cost.budget",
    "core.cost.tracker",
    "core.approval",
]

[[tool.importlinter.contracts]]
name = "RÈGLE 5 — Interfaces n'importent que core, jamais legacy"
type = "forbidden"
source_modules = ["interfaces"]
forbidden_modules = [
    "legacy",
]

[[tool.importlinter.contracts]]
name = "RÈGLE 6 — Plugins n'importent pas legacy"
type = "forbidden"
source_modules = ["plugins"]
forbidden_modules = [
    "legacy",
    "core.legacy",
]
markers = [
    "amd: requires AMD GPU",
    "apple: requires Apple Silicon",
    "cloud: requires cloud API keys",
    "docker: requires a working Docker daemon (no GPU required)",
    "live: requires running inference engine",
    "macos15: requires macOS 15+ (Sequoia) for Apple FM",
    "live_channel: requires real channel credentials (env vars)",
    "nvidia: requires NVIDIA GPU",
    "slow: long-running test",
    "hub: downloads real datasets from the HuggingFace Hub at runtime; excluded from the default CI lane (run with -m hub)",
    "live_external: requires HERMES_AGENT_PATH and OPENCLAW_PATH; spawns real foreign-framework subprocesses",
    "modal: requires Modal token + network; runs real swebench harness on Modal",
]

[tool.ruff]
target-version = "py310"
src = ["core", "interfaces", "plugins", "sdk", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[dependency-groups]
dev = [
    "maturin>=1.12.6",
    "import-linter>=2.1",
]
