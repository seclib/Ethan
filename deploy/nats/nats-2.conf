# Authentification par token (CTO P0-3) — $NATS_TOKEN vient de l'environnement.
# Serveur et clients partagent la meme valeur ; variable absente = demarrage refuse.
authorization {
  token: $NATS_TOKEN
}

port: 4223
http_port: 8223
cluster {
  port: 6223
  name: ethan-cluster
  routes: ["nats://nats-1:6222", "nats://nats-3:6222"]
}
jetstream: enabled
max_payload: 1048576