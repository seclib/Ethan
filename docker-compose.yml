services:
  # ── Infrastructure Services ─────────────────────────────────────────
  nats:
    image: nats:2.10-alpine
    container_name: ethan-nats
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
      - "127.0.0.1:6222:6222"
    # Expose the NATS monitoring API so health reflects a usable server,
    # rather than merely an open client TCP port.
    command: ["-js", "-m", "8222"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    restart: unless-stopped
    networks:
      - ethan-core
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: ethan-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "60", "100"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    restart: unless-stopped
    networks:
      - ethan-core
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: ethan-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ethan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ethan
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ethan && psql -U ethan -d ethan -c 'SELECT 1' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - ethan-core
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Application Services ────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      NATS_URL: nats://nats:4222
      DATABASE_URL: postgresql://ethan:${POSTGRES_PASSWORD}@postgres:5432/ethan
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379/0
      LOG_LEVEL: INFO
      LOG_FORMAT: "${LOG_FORMAT:-text}"
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_started
      redis:
        condition: service_started
    command: uvicorn interfaces.api.main:app --host 0.0.0.0 --port 8000 --workers 1
    restart: unless-stopped
    networks:
      - ethan-core
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kernel:
    build:
      context: .
      dockerfile: deploy/Dockerfile.kernel
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      NATS_URL: nats://nats:4222
      DATABASE_URL: postgresql://ethan:${POSTGRES_PASSWORD}@postgres:5432/ethan
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379/0
      LOG_LEVEL: INFO
      LOG_FORMAT: "${LOG_FORMAT:-text}"
      ENABLE_LEARNING: "${ENABLE_LEARNING:-false}"
      ENABLE_METACOGNITION: "${ENABLE_METACOGNITION:-false}"
      ENABLE_AUTONOMY: "${ENABLE_AUTONOMY:-false}"
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_started
      redis:
        condition: service_started
    command: python core/ethan_bootstrap.py
    restart: unless-stopped
    networks:
      - ethan-core
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Cognitive Modules (unifié) ─────────────────────────────────────
  modules:
    build:
      context: .
      dockerfile: deploy/Dockerfile.module
    environment:
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379/0
      DATABASE_URL: postgresql://ethan:${POSTGRES_PASSWORD}@postgres:5432/ethan
      LOG_LEVEL: INFO
      LOG_FORMAT: "${LOG_FORMAT:-text}"
    command: python -m core.modules
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_started
      redis:
        condition: service_started
      api:
        condition: service_started
      kernel:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped
    networks:
      - ethan-core
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Backup Service ──────────────────────────────────────────────────────
  pg_backup:
    build:
      context: .
      dockerfile: deploy/Dockerfile.pg_backup
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ethan
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ethan
      BACKUP_DIR: /var/backups/ethan
      BACKUP_RETENTION_DAYS: "30"
      BACKUP_INTERVAL_SECONDS: "21600"
    volumes:
      - postgres_backup:/var/backups/ethan
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h postgres -U ethan -d ethan 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - ethan-core
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── WebUI ───────────────────────────────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: deploy/Dockerfile.ui
      args:
        ETHAN_API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      ETHAN_API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_started
      kernel:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - ethan-core
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nats_data:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local
  postgres_backup:
    driver: local

networks:
  ethan-core:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
