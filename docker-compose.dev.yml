# =============================================================================
# docker-compose.dev.yml — Ethan OS (Development Extension)
# =============================================================================
#
# Services additionnels pour le développement :
#   - Qdrant (vector store)
#   - ChromaDB (vector store alternatif)
#   - Ollama (LLM local)
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Note : Redis et PostgreSQL sont définis dans docker-compose.yml (fichier principal)
# pour éviter les conflits de réseaux et de noms de conteneurs.
# Ce fichier n'ajoute QUE les services optionnels de développement.
# =============================================================================

services:
  # ===========================================================================
  # Qdrant — Vector database (production)
  # ===========================================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ethan-qdrant
    hostname: qdrant
    networks:
      - ethan-core
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # ChromaDB — Vector store alternatif (développement)
  # ===========================================================================
  chromadb:
    image: chromadb/chroma:latest
    container_name: ethan-chromadb
    hostname: chromadb
    networks:
      - ethan-core
    ports:
      - "${CHROMADB_PORT:-8001}:8000"
    volumes:
      - chromadb-data:/chroma/chroma
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
      - CHROMA_SERVER_CORS_ALLOW_ORIGINS=*
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Ollama — LLM local
  # Note: le service `ollama` est défini dans docker-compose.yml avec le profil `llm`.
  # Ne pas le redéfinir ici pour éviter les doublons. Utiliser :
  #   docker compose --profile llm up
  # ===========================================================================

# ── Volumes additionnels ──────────────────────────────────────────────────────
volumes:
  qdrant-data:
    name: ethan-qdrant-data
  chromadb-data:
    name: ethan-chromadb-data
  ollama-models:
    name: ethan-ollama-models

# ── Réseau partagé avec docker-compose.yml ────────────────────────────────────
