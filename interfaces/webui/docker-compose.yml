version: "3.8"

services:
  webui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ethan-webui
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ethan-network

  # Kernel (Go backend) - optionnel pour dev
  kernel:
    image: ethan/kernel:latest
    container_name: ethan-kernel
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://ethan:ethan@postgres:5432/ethan
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ethan-network

  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: ethan-postgres
    environment:
      - POSTGRES_USER=ethan
      - POSTGRES_PASSWORD=ethan
      - POSTGRES_DB=ethan
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ethan"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ethan-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: ethan-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ethan-network

  # NATS
  nats:
    image: nats:2-alpine
    container_name: ethan-nats
    command: -js
    ports:
      - "4222:4222"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4222"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ethan-network

volumes:
  postgres-data:
  redis-data:

networks:
  ethan-network:
    driver: bridge