# ETHAN AI Router — Règles de routage intelligent
#
# Le routeur analyse le message utilisateur et sélectionne automatiquement
# le meilleur provider/modèle selon la tâche détectée.
#
# Local-first obligatoire : les providers locaux (ollama, vllm, llamacpp)
# sont toujours préférés si un modèle correspond aux critères.

# Mode par défaut : "automatic" ou "manual"
default_mode: automatic

# Fallback si aucune règle ne correspond
fallback:
  provider: ollama
  model: llama3.1

# Règles de routage — ordre de priorité = ordre du fichier
