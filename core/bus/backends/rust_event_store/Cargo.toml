[package]
name = "ethan_event_store"
version = "0.1.0"
edition = "2021"

[lib]
name = "ethan_event_store"
crate-type = ["cdylib", "pyextension"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]