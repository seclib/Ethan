# Configuration NATS ETHAN — authentification par token (CTO P0-3 / Red Team
# Attaque « NATS sans auth »). Le token provient de l'environnement
# NATS_TOKEN (jamais versionné) : serveur et clients doivent partager la
# même valeur. Une variable absente empêche le démarrage (fail-closed).
authorization {
  token: $NATS_TOKEN
}