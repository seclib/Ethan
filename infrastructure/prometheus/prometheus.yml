global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'ethan-kernel'
    static_configs:
      - targets: ['kernel:9090']
        labels:
          service: cognitive-kernel

  - job_name: 'ethan-api'
    static_configs:
      - targets: ['api:8000']
        labels:
          service: api-gateway

  - job_name: 'nats'
    static_configs:
      - targets: ['nats:8222']
        labels:
          service: nats

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
        labels:
          service: loki

  - job_name: 'vault'
    metrics_path: /v1/sys/metrics
    params:
      format: ['prometheus']
    bearer_token: ${VAULT_DEV_ROOT_TOKEN_ID:-ethan-root-token}
    static_configs:
      - targets: ['vault:8200']
        labels:
          service: vault

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: grafana